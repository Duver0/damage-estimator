serenity {
  project.name = "Cotizador de Daños - UI Tests"
  take.screenshots = AFTER_EACH_STEP
  reports.show.step.details = true
}

webdriver.timeouts.implicitlywait = 5000
webdriver.wait.for.timeout = 15000

# Default frontend URL (Docker). Override locally: -Dfrontend.url=http://localhost:5173
frontend.url = "http://cotizador_frontend:80"

webdriver.capabilities {
  browserName = "chrome"
  "goog:chromeOptions" {
    args = ["--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1280,900"]
  }
}

environments {
  default {
    webdriver.driver = remote
    webdriver.remote.url = "http://selenium:4444"
    webdriver.remote.driver = chrome
  }
  local {
    webdriver.driver = chrome
    webdriver.capabilities {
      browserName = "chrome"
      "goog:chromeOptions" {
        args = ["--headless=new", "--no-sandbox", "--disable-dev-shm-usage", "--disable-gpu", "--window-size=1280,900"]
      }
    }
  }
  docker {
    webdriver.driver = remote
    webdriver.remote.url = "http://selenium:4444"
    webdriver.remote.driver = chrome
  }
}

cucumber {
  options {
    tags = "not @wip"
  }
}
