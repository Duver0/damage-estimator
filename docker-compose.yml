services:
  mongo:
    image: mongo:7
    container_name: cotizador_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: cotizador_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: cotizador_danos
      DEBUG: "false"
    depends_on:
      mongo:
        condition: service_healthy

  seed:
    build:
      context: ./backend
    container_name: cotizador_seed
    command: python fixtures/seed.py
    environment:
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: cotizador_danos
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: cotizador_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  selenium:
    image: selenium/standalone-chrome:latest
    container_name: cotizador_selenium
    restart: unless-stopped
    ports:
      - "4444:4444"
      - "7900:7900"
    volumes:
      - /dev/shm:/dev/shm
    shm_size: 2gb

  qa:
    build:
      context: .
      dockerfile: Dockerfile.qa
    container_name: cotizador_qa
    depends_on:
      frontend:
        condition: service_started
      selenium:
        condition: service_started
      seed:
        condition: service_completed_successfully
    volumes:
      - ./qa/build:/app/build
      - ./qa/target:/app/target
    profiles:
      - qa

volumes:
  mongo_data:
